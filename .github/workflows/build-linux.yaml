name: build-ubuntu

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt-get install -y libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config cmake git g++ make

    - name: Setting up vcpkg
      run: |
        mkdir build
        cd build
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.sh
        ./vcpkg install raylib asio glfw3
        cd ../..

    - name: Check compilation
      run: |
        echo "## 🚀 Compilation result" >> $GITHUB_STEP_SUMMARY
        {
          set +e
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=build/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build
          if [ $? -ne 0 ]; then
            echo "- ### Build ubuntu failed ❌" >> $GITHUB_STEP_SUMMARY
            echo "Compilation failed."
            exit 1
          else
            echo "- ### Build ubuntu succeed ✅" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
        }
