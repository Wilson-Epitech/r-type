name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasio-dev libglfw3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=$HOME/deps -DBUILD_EXAMPLES=OFF -DUSE_EXTERNAL_GLFW=ON
          cmake --build /tmp/raylib/build -j4 --target install
          mkdir -p $HOME/deps/lib/cmake/asio
          printf 'add_library(asio INTERFACE IMPORTED)\nset_target_properties(asio PROPERTIES INTERFACE_COMPILE_DEFINITIONS ASIO_STANDALONE INTERFACE_LINK_LIBRARIES pthread)\n' > $HOME/deps/lib/cmake/asio/asio-config.cmake
      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_PREFIX_PATH=$HOME/deps -DCMAKE_CXX_FLAGS="-I$HOME/deps/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$HOME/deps/lib" -DCMAKE_SHARED_LINKER_FLAGS="-L$HOME/deps/lib" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="-lraylib -lglfw -lGL -lpthread -ldl -lm -lrt -lX11"
          cmake --build build -j4
